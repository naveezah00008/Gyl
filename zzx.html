
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100vh;
    height: 100dvh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    outline: none;
}
</style>
</head>

<body>

<div class="player">

    <video
        id="videoPlayer"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
    >
        <source
            src="https://cdn.videy.co/V936179w1.mp4"
            type="video/mp4">
        
        Browser tidak mendukung video ini.
    </video>

</div>

</body>
</html>

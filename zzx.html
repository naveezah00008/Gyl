<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.player {
    width: 100%;
    max-width: 950px;
    position: relative;
}

video {
    width: 100%;
    display: block;
    background: #000;
    border-radius: 20px;
}

.play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 15px 35px;
    color: white;
    background: linear-gradient(135deg, #ff0000, #990000);
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

@media(max-width: 600px) {
    .player {
        width: 100%;
    }

    video {
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="player">

    <video id="videoPlayer" controls playsinline preload="metadata">
        <source src="https://cdn.videy.co/V936179w1.mp4" type="video/mp4">
    </video>

    <button class="play-button" id="playButton">PLAY VIDEO</button>

</div>

<script>
const video = document.getElementById("videoPlayer");
const button = document.getElementById("playButton");

button.addEventListener("click", function() {
    video.play();
});

video.addEventListener("play", function() {
    button.style.display = "none";
});

video.addEventListener("pause", function() {
    if (!video.ended) {
        button.style.display = "block";
    }
});

video.addEventListener("ended", function() {
    button.style.display = "block";
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videy Player</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}
</style>
</head>

<body>

<video
  id="video"
  src="https://cdn.videy.co/V936179w1.mp4"
  controls
  playsinline
  webkit-playsinline
  preload="auto">
</video>

<script>
const video = document.getElementById("video");

video.addEventListener("error", function() {
  document.body.insertAdjacentHTML(
    "beforeend",
    '<div style="position:fixed;top:10px;left:10px;color:white;font:14px Arial">Gagal memuat video. Kode error: ' +
    (video.error ? video.error.code : "tidak diketahui") +
    '</div>'
  );
});
</script>

</body>
</html>

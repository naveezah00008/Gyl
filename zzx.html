
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Player</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
}

.player {
  width: 100%;
  height: 100dvh;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
</style>
</head>

<body>

<div class="player">
  <video
    controls
    playsinline
    webkit-playsinline
    preload="metadata">
    <source
      src="https://cdn.videy.co/V936179w1.mp4"
      type="video/mp4">
  </video>
</div>

</body>
</html>

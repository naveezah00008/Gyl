
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
</style>
</head>

<body>

<div class="player">
    <video
        controls
        playsinline
        preload="metadata"
        poster="">
        <source src="https://cdn.slicedrv.com/K8EFBQJq1.mp4" type="video/mp4">
        Browser tidak mendukung pemutar video.
    </video>
</div>

</body>
</html>

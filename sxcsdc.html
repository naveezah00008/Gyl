
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
</style>
</head>

<body>

<div class="player">
    <iframe
        src="https://videy.co/v/?id=V936179w1"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        loading="eager">
    </iframe>
</div>

</body>
</html>
